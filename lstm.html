<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LSTM Forecast</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #log {
      margin-top: 20px;
      padding: 15px;
      background: #111827;
      color: #00ff88;
      border-radius: 8px;
      height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
    }

    #forecastContainer {
      margin-top: 25px;
    }

    .forecast-card {
      background: white;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .forecast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forecast-header h3 {
      margin: 0;
    }

    .forecast-status {
      margin: 10px 0;
      padding: 8px;
      border-radius: 5px;
      background: #eee;
    }

    .forecast-status.success {
      background: #dcfce7;
      color: #166534;
    }

    .forecast-status.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .forecast-status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 350px;
    }

    .forecast-summary {
      margin: 15px 0;
      line-height: 1.8;
    }

    .table-wrapper {
      max-height: 400px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f1f5f9;
      position: sticky;
      top: 0;
    }

    #dataInfo {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>LSTM Forecast Monitoring Pesisir</h1>

  <p>
    Forecast suhu, kelembapan, tekanan udara,
    tinggi muka air, dan kecepatan angin.
  </p>

  <button id="startLSTM">
    Mulai Forecast
  </button>

  <div id="dataInfo">
    Data belum dibaca.
  </div>

  <h3>Log Proses</h3>

  <div id="log">
    Belum ada proses.
  </div>

  <div id="forecastContainer"></div>


  <!-- ===================================================== -->
  <!-- TENSORFLOW JS HARUS DIMUAT TERLEBIH DAHULU -->
  <!-- ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

  <!-- ===================================================== -->
  <!-- CHART JS -->
  <!-- ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ===================================================== -->
  <!-- PROGRAM LSTM -->
  <!-- ===================================================== -->

  <script type="module" src="./lstm.js"></script>

</body>
</html>
