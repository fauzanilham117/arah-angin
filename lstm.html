<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Prediksi Cuaca & Air Laut (LSTM)</title>
  
  <!-- CDN TensorFlow.js, Chart.js & Firebase App + Database -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f7f6;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #statusText {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    .progress-bar-bg {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
    }
    #progressFill {
      width: 0%;
      height: 15px;
      background-color: #007bff;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sistem Prediksi Cuaca & Air Laut (LSTM)</h2>
    <p>Klik tombol di bawah untuk mengambil data dari Firebase dan menjalankan model prediksi.</p>
    
    <button id="btnStart">🚀 Mulai Pelatihan & Prediksi</button>
    
    <div id="statusText">Status: Siap</div>
    <div class="progress-bar-bg">
      <div id="progressFill"></div>
    </div>
  </div>

  <script>
    // 1. Kredensial Firebase yang Sudah Dimasukkan Langsung
    const firebaseConfig = {
      apiKey: "AIzaSyCt2pkxO6vYpDXFHNqbFWmlMmS2JLlSjA0",
      authDomain: "arah-angin-76f91.firebaseapp.com",
      databaseURL: "https://arah-angin-76f91-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "arah-angin-76f91",
      storageBucket: "arah-angin-76f91.firebasestorage.app",
      messagingSenderId: "937712967453",
      appId: "1:937712967453:web:36e81a289fe2a33b694bf4",
      measurementId: "G-YKXYC252NV"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Fungsi Pemrosesan Vektor & Parsing Data
    function processRawData(rawData) {
      const rawList = Array.isArray(rawData) 
        ? rawData 
        : Object.values(rawData).filter(d => d && typeof d === 'object');

      return rawList.map(item => {
        const water_level = Number(item.water_level ?? item.tinggi_muka_air ?? item.tinggi_air ?? 0);
        const temp = Number(item.temp ?? item.suhu ?? 0);
        const humidity = Number(item.humidity ?? item.kelembapan ?? 0);
        const pressure = Number(item.pressure ?? item.tekanan ?? 0);
        const wind_speed = Number(item.wind_speed ?? item.kecepatan_angin ?? item.speed ?? 0);
        const deg = Number(item.wind_dir ?? item.arah_angin ?? item.deg ?? 0);

        const rad = (deg * Math.PI) / 180;
        return {
          water_level,
          temp,
          humidity,
          pressure,
          wind_speed,
          d_wind_sin: Math.sin(rad),
          d_wind_cos: Math.cos(rad)
        };
      });
    }

    // 3. Fungsi Utama Pelatihan & Prediksi LSTM
    async function startLSTMTraining() {
      const btn = document.getElementById("btnStart");
      const statusText = document.getElementById("statusText");
      const progressFill = document.getElementById("progressFill");

      btn.disabled = true;
      statusText.innerText = "Mengambil data histori dari Firebase...";
      progressFill.style.width = "10%";

      try {
        // Ambil data dari Realtime Database
        let snapshot = await db.ref('sensor').once('value');
        let dataVal = snapshot.val();
        
        if (!dataVal) {
          snapshot = await db.ref('cuaca/history').once('value');
          dataVal = snapshot.val();
        }

        if (!dataVal) throw new Error("Data histori tidak ditemukan di database!");

        const cleanDataset = processRawData(dataVal);
        if (cleanDataset.length < 10) {
          throw new Error(`Dataset terlalu sedikit (butuh minimal 10 data histori). Data saat ini: ${cleanDataset.length}`);
        }

        statusText.innerText = `Memproses ${cleanDataset.length} sampel data...`;
        progressFill.style.width = "30%";

        // Konfigurasi Fitur
        const features = ['water_level', 'temp', 'humidity', 'pressure', 'wind_speed', 'd_wind_sin', 'd_wind_cos'];
        const numFeatures = features.length;
        const timeSteps = 5;
        const forecastSteps = 12;

        // Normalisasi Min-Max
        const mins = Array(numFeatures).fill(Infinity);
        const maxs = Array(numFeatures).fill(-Infinity);

        const processedData = cleanDataset.map(d => features.map(f => d[f]));

        for (let i = 0; i < processedData.length; i++) {
          for (let j = 0; j < numFeatures; j++) {
            if (processedData[i][j] < mins[j]) mins[j] = processedData[i][j];
            if (processedData[i][j] > maxs[j]) maxs[j] = processedData[i][j];
          }
        }

        const scaledFeatures = processedData.map(row => 
          row.map((val, col) => {
            const range = maxs[col] === mins[col] ? 1 : (maxs[col] - mins[col]);
            return (val - mins[col]) / range;
          })
        );

        // Buat Sekuens Dataset Training
        const X_train = [], Y_train = [];
        for (let i = 0; i <= scaledFeatures.length - timeSteps - 1; i++) {
          X_train.push(scaledFeatures.slice(i, i + timeSteps));
          Y_train.push(scaledFeatures[i + timeSteps]);
        }

        const xs = tf.tensor3d(X_train);
        const ys = tf.tensor2d(Y_train);

        // Arsitektur Model LSTM
        const model = tf.sequential();
        model.add(tf.layers.lstm({ units: 32, returnSequences: false, inputShape: [timeSteps, numFeatures] }));
        model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
        model.add(tf.layers.dense({ units: numFeatures }));
        model.compile({ optimizer: tf.train.adam(0.005), loss: 'meanSquaredError' });

        statusText.innerText = "Melatih Model LSTM...";
        
        await model.fit(xs, ys, {
          epochs: 30,
          batchSize: 8,
          callbacks: {
            onEpochEnd: (epoch, logs) => {
              const pct = Math.round(((epoch + 1) / 30) * 60) + 30;
              progressFill.style.width = pct + "%";
              statusText.innerText = `Training Epoch ${epoch + 1}/30 - Loss: ${logs.loss.toFixed(5)}`;
            }
          }
        });

        xs.dispose();
        ys.dispose();

        // Autoregressive Prediction untuk Masa Depan
        let currentSeq = scaledFeatures.slice(-timeSteps);
        const predictions = [];

        for (let s = 0; s < forecastSteps; s++) {
          const inputTensor = tf.tensor3d([currentSeq]);
          const predTensor = model.predict(inputTensor);
          const predArray = (await predTensor.array())[0];

          predictions.push(predArray);
          currentSeq.shift();
          currentSeq.push(predArray);

          inputTensor.dispose();
          predTensor.dispose();
        }

        model.dispose();

        progressFill.style.width = "100%";
        statusText.innerText = "✅ Pelatihan & Prediksi Selesai!";
        console.log("Hasil Prediksi (Normalized):", predictions);

      } catch (error) {
        console.error(error);
        statusText.innerText = "❌ Gagal: " + error.message;
        progressFill.style.width = "0%";
      } finally {
        btn.disabled = false;
      }
    }

    // Pasang listener pada tombol saat halaman dimuat
    document.getElementById("btnStart").addEventListener("click", startLSTMTraining);
  </script>
</body>
</html>
